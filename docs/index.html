<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Automation Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      background: #eef2ff;
      color: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 50%, #dbeafe 100%);
    }

    .page {
      width: min(1200px, calc(100% - 40px));
      margin: auto;
      padding: 36px 0 60px;
    }

    .hero {
      padding: 40px 36px;
      border-radius: 32px;
      background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.14), transparent 34%),
                  linear-gradient(180deg, rgba(255,255,255,0.92), rgba(248,250,252,0.95));
      border: 1px solid rgba(148,163,184,0.22);
      box-shadow: 0 32px 90px rgba(15, 23, 42, 0.08);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 3.8rem);
      line-height: 1.03;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 20px 0 0;
      max-width: 760px;
      font-size: 1rem;
      color: #475569;
      line-height: 1.8;
    }

    .hero-grid {
      display: grid;
      gap: 18px;
      margin-top: 32px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .status-card {
      border-radius: 22px;
      background: white;
      border: 1px solid #e2e8f0;
      padding: 24px;
      min-height: 170px;
    }

    .status-card h2 {
      margin-top: 0;
      font-size: 1.05rem;
    }

    .status-card p {
      color: #475569;
      margin: 12px 0 0;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .status-chip {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 600;
      margin-top: 16px;
    }

    .status-chip span {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #4338ca;
    }

    .note-block {
      margin-top: 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      color: #475569;
      line-height: 1.75;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      border: 1px solid rgba(148,163,184,0.22);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.05);
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
    }

    .wireframe {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .wireframe-block {
      background: #f8fafc;
      border-radius: 18px;
      border: 1px dashed #cbd5e1;
      padding: 22px;
      min-height: 180px;
    }

    .wireframe-block h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .wireframe-block p {
      color: #475569;
      line-height: 1.8;
    }

    .form-prototype {
      display: grid;
      gap: 22px;
    }

    .form-grid {
      display: grid;
      gap: 22px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .form-panel {
      background: #f8fafc;
      border-radius: 22px;
      border: 1px solid #e2e8f0;
      padding: 26px;
    }

    .form-panel h3 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.05rem;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.92rem;
      color: #475569;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 12px 14px;
      background: #ffffff;
      color: #0f172a;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button-row button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      min-width: 168px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #4338ca, #6366f1);
      box-shadow: 0 18px 30px rgba(67, 56, 202, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button-row button:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 40px rgba(67, 56, 202, 0.24);
    }

    .task-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .task-card {
      padding: 22px;
      border-radius: 22px;
      border: 1px solid #e2e8f0;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), #f8fafc);
    }

    .task-card h3 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 1rem;
    }

    .task-card p {
      margin: 0 0 12px;
      color: #475569;
      line-height: 1.75;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      color: #475569;
      font-size: 0.95rem;
    }

    .footer a {
      color: #4338ca;
      text-decoration: none;
    }

    .task-status-grid {
      display: grid;
      gap: 16px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      border-radius: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .task-info h4 {
      margin: 0 0 4px 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .task-info p {
      margin: 0;
      color: #64748b;
      font-size: 0.9rem;
    }

    .task-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #cbd5e1;
    }

    .status-indicator.pending { background: #f59e0b; }
    .status-indicator.running { background: #3b82f6; animation: pulse 2s infinite; }
    .status-indicator.success { background: #10b981; }
    .status-indicator.error { background: #ef4444; }

    .status-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
    }

    .activity-log {
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      padding: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log-entry {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      font-size: 0.85rem;
      color: #64748b;
      font-family: ui-monospace, monospace;
      min-width: 70px;
    }

    .log-message {
      font-size: 0.9rem;
      color: #374151;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
<body>
  <main class="page">
    <section class="hero">
      <h1>Billing Automation Dashboard</h1>
      <p>A lightweight mockup and status page for the Billing Automation project. This page shows how the UI can look, what tasks it supports, and how the backend connects to your local Couchbase instance.</p>

      <div class="hero-grid">
        <div class="status-card">
          <h2>Page preview</h2>
          <p>Static mockup for the operator workflow. This page is hosted from the repo’s <strong>docs/</strong> folder.</p>
          <div class="status-chip"><span></span>Ready to publish</div>
        </div>
        <div class="status-card">
          <h2>Local database</h2>
          <p>Backend is configured to use your local Couchbase instance:</p>
          <div class="code">host: localhost
bucket: sessiondb_billing
user: mahesh</div>
        </div>
        <div class="status-card">
          <h2>Publishing</h2>
          <p>If the page is still 404, verify the Pages settings and refresh after a minute.</p>
          <div class="status-chip"><span></span>GitHub Pages pending</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Task overview</div>
      <div class="task-grid">
        <div class="task-card">
          <h3>Scenario 1: Pre-final bill</h3>
          <p>Validate adjustments, back up the test bill doc, generate a test bill, and then create a final bill without email.</p>
          <div class="badge">Input validation</div>
        </div>
        <div class="task-card">
          <h3>Scenario 2: Cancelled line recovery</h3>
          <p>Restore cancelled line records, adjust recurring charges and counters, reset billing flags, then rerun the test and final bill flow.</p>
          <div class="badge">Document repair</div>
        </div>
        <div class="task-card">
          <h3>Scenario 3: Installment handling</h3>
          <p>Update installment mapping, decrement counters safely, rerun billing, and reconcile future payment records.</p>
          <div class="badge">Installment support</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Prototype UI</div>
      <div class="form-prototype">
        <div class="form-grid">
          <div class="form-panel">
            <h3>Account and billing</h3>
            <label>Account ID</label>
            <input value="111100000339" readonly />
            <label>Month-Year</label>
            <input value="0326" readonly />
            <label>Bill date</label>
            <input value="2026-04-05" readonly />
            <label>Bill due date</label>
            <input value="2026-04-25" readonly />
          </div>
          <div class="form-panel">
            <h3>Billing system</h3>
            <label>From date</label>
            <input value="2026-03-01" readonly />
            <label>To date</label>
            <input value="2026-03-31" readonly />
            <label>Bill generation IP</label>
            <input value="http://localhost:8088" readonly />
            <label>Invoice service IP</label>
            <input value="http://localhost:8090" readonly />
          </div>
        </div>
        <div class="button-row">
          <button type="button">Load scenario</button>
          <button type="button">Run pre-checks</button>
          <button type="button">Generate test bill</button>
          <button type="button">Generate final bill</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">User workflow</div>
      <div class="wireframe">
        <div class="wireframe-block">
          <h3>Input capture</h3>
          <p>Collect all required billing metadata and IP endpoints in a single form, then validate the account state before any action.</p>
        </div>
        <div class="wireframe-block">
          <h3>Pre-checks</h3>
          <p>Show current Couchbase document status: adjustments, UBL docs, bills, cancelled lines, and installment flags.</p>
        </div>
        <div class="wireframe-block">
          <h3>Run actions</h3>
          <p>Allow the operator to trigger test bill, final bill, invoice preview, and document repair steps with clear status feedback.</p>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Task status</div>
      <div class="task-status-grid">
        <div class="task-item">
          <div class="task-info">
            <h4>Document validation</h4>
            <p>Checking Couchbase documents and payment flags</p>
          </div>
          <div class="task-status">
            <span class="status-indicator pending"></span>
            <span class="status-text">Pending</span>
          </div>
        </div>
        <div class="task-item">
          <div class="task-info">
            <h4>Test bill generation</h4>
            <p>Creating test bill for validation</p>
          </div>
          <div class="task-status">
            <span class="status-indicator idle"></span>
            <span class="status-text">Ready</span>
          </div>
        </div>
        <div class="task-item">
          <div class="task-info">
            <h4>Final bill generation</h4>
            <p>Generating final bill without email</p>
          </div>
          <div class="task-status">
            <span class="status-indicator idle"></span>
            <span class="status-text">Ready</span>
          </div>
        </div>
        <div class="task-item">
          <div class="task-info">
            <h4>Invoice preview</h4>
            <p>Creating invoice preview for validation</p>
          </div>
          <div class="task-status">
            <span class="status-indicator idle"></span>
            <span class="status-text">Ready</span>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Activity log</div>
      <div class="activity-log">
        <div class="log-entry">
          <span class="log-time">14:32:15</span>
          <span class="log-message">System initialized</span>
        </div>
        <div class="log-entry">
          <span class="log-time">14:32:10</span>
          <span class="log-message">Connected to Couchbase localhost</span>
        </div>
        <div class="log-entry">
          <span class="log-time">14:32:05</span>
          <span class="log-message">Billing automation dashboard loaded</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      Built for Billing Automation demo. Use this page as a prototype while we add live backend integration.
    </footer>
    <script>
      // Simulate live UI interactions
      document.addEventListener('DOMContentLoaded', function() {
        const buttons = document.querySelectorAll('.button-row button');
        const statusChips = document.querySelectorAll('.status-chip');
        const formInputs = document.querySelectorAll('input');

        // Make inputs editable for demo
        formInputs.forEach(input => {
          input.removeAttribute('readonly');
          input.addEventListener('input', function() {
            this.style.borderColor = '#10b981';
            setTimeout(() => this.style.borderColor = '#cbd5e1', 1000);
          });
        });

        // Add click handlers to buttons
        buttons.forEach(button => {
          button.addEventListener('click', function() {
            const action = this.textContent.toLowerCase().replace(' ', '-');
            simulateAction(action, this);
          });
        });

        // Update status chips periodically
        setInterval(() => {
          statusChips.forEach(chip => {
            const statuses = ['Ready to publish', 'GitHub Pages pending', 'Backend connected'];
            const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
            chip.innerHTML = `<span></span>${randomStatus}`;
          });
        }, 5000);

        function simulateAction(action, button) {
          const originalText = button.textContent;
          button.textContent = 'Processing...';
          button.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
          button.disabled = true;

          // Update task status
          updateTaskStatus(action, 'running');

          // Simulate API call
          setTimeout(() => {
            button.textContent = '✓ ' + originalText;
            button.style.background = 'linear-gradient(135deg, #10b981, #059669)';

            // Update task status to success
            updateTaskStatus(action, 'success');

            // Add to activity log
            addActivityLog(`${originalText} completed successfully`);

            // Show success message
            showNotification(`${originalText} completed successfully!`, 'success');

            setTimeout(() => {
              button.textContent = originalText;
              button.style.background = 'linear-gradient(135deg, #4338ca, #6366f1)';
              button.disabled = false;
              updateTaskStatus(action, 'idle');
            }, 2000);
          }, 1500 + Math.random() * 2000);
        }

        function updateTaskStatus(action, status) {
          const taskMap = {
            'load-scenario': 'Document validation',
            'run-pre-checks': 'Document validation',
            'generate-test-bill': 'Test bill generation',
            'generate-final-bill': 'Final bill generation'
          };

          const taskName = taskMap[action];
          if (!taskName) return;

          const taskItems = document.querySelectorAll('.task-item');
          taskItems.forEach(item => {
            const title = item.querySelector('h4').textContent;
            if (title === taskName) {
              const indicator = item.querySelector('.status-indicator');
              const statusText = item.querySelector('.status-text');

              indicator.className = 'status-indicator ' + status;
              statusText.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            }
          });
        }

        function addActivityLog(message) {
          const log = document.querySelector('.activity-log');
          const now = new Date();
          const time = now.toLocaleTimeString('en-US', {
            hour12: false,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });

          const entry = document.createElement('div');
          entry.className = 'log-entry';
          entry.innerHTML = `
            <span class="log-time">${time}</span>
            <span class="log-message">${message}</span>
          `;

          log.insertBefore(entry, log.firstChild);

          // Keep only last 10 entries
          const entries = log.querySelectorAll('.log-entry');
          if (entries.length > 10) {
            entries[entries.length - 1].remove();
          }
        }

        function showNotification(message, type) {
          const notification = document.createElement('div');
          notification.className = `notification ${type}`;
          notification.textContent = message;
          notification.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            background: ${type === 'success' ? '#10b981' : '#ef4444'};
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            z-index: 1000;
            animation: slideIn 0.3s ease;
          `;

          document.body.appendChild(notification);

          setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => notification.remove(), 300);
          }, 3000);
        }

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
          @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
          }
          @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
          }
          .notification {
            font-weight: 600;
            font-size: 0.95rem;
          }
          .button-row button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
          }
          .form-panel input:focus {
            outline: none;
            border-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1);
          }
        `;
        document.head.appendChild(style);
      });
    </script>
  </body>
</html>
